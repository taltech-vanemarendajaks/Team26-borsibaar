# HTTP -> HTTPS (keep ACME path for certbot renewals)
server {
    listen 80;
    listen [::]:80;
    server_name team26-borsibaar.ddns.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTP -> HTTPS (keep ACME path for certbot renewals)
server {
    listen 80;
    listen [::]:80;
    server_name team26-borsibaar.ddns.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS -> compose nginx (localhost only)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name team26-borsibaar.ddns.net;

    ssl_certificate     /etc/letsencrypt/live/team26-borsibaar.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/team26-borsibaar.ddns.net/privkey.pem;

    client_max_body_size 50m;

    # Frontend and everything else
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Backend API (explicit but same upstream)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # OAuth2 redirects (explicit but same upstream)
    location /oauth2/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
