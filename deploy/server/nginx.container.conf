server {
  listen 80;
  server_name _;

  # preserve forwarded headers from host nginx
  set $xf_proto $http_x_forwarded_proto;
  if ($xf_proto = "") { set $xf_proto $scheme; }

  set $xf_host $http_x_forwarded_host;
  if ($xf_host = "") { set $xf_host $http_host; }

  # Backend API
  location /api/ {
    proxy_pass http://backend:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $xf_host;
    proxy_set_header X-Forwarded-Host $xf_host;
    proxy_set_header X-Forwarded-Proto $xf_proto;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # OAuth2 start
  location /oauth2/ {
    proxy_pass http://backend:8080/oauth2/;
    proxy_http_version 1.1;
    proxy_set_header Host $xf_host;
    proxy_set_header X-Forwarded-Host $xf_host;
    proxy_set_header X-Forwarded-Proto $xf_proto;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # OAuth2 callback
  location /login/oauth2/ {
    proxy_pass http://backend:8080/login/oauth2/;
    proxy_http_version 1.1;
    proxy_set_header Host $xf_host;
    proxy_set_header X-Forwarded-Host $xf_host;
    proxy_set_header X-Forwarded-Proto $xf_proto;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Your backend's post-login endpoints (THIS is the fix)
  location /auth/ {
    proxy_pass http://backend:8080/auth/;
    proxy_http_version 1.1;
    proxy_set_header Host $xf_host;
    proxy_set_header X-Forwarded-Host $xf_host;
    proxy_set_header X-Forwarded-Proto $xf_proto;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Everything else -> frontend
  location / {
    proxy_pass http://frontend:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $xf_host;
    proxy_set_header X-Forwarded-Host $xf_host;
    proxy_set_header X-Forwarded-Proto $xf_proto;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
