services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: borsibaar
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped

  backend:
    image: ghcr.io/taltech-vanemarendajaks/borsibaar-backend:latest
    env_file:
      - ./backend.env
    depends_on:
      - postgres
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    image: ghcr.io/taltech-vanemarendajaks/borsibaar-frontend:latest
    environment:
      BACKEND_URL: http://backend:8080
    expose:
      - "3000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
